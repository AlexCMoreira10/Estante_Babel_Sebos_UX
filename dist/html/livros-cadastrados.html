<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#315c50">
  <title>Livros cadastrados | Estante Parceiros</title>
  <link rel="stylesheet" href="https://unpkg.com/@ionic/core@latest/css/ionic.bundle.css">
  <script type="module" src="https://unpkg.com/@ionic/core@latest/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://unpkg.com/@ionic/core@latest/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="../css/Main.css">
  <script type="importmap">
    {
      "imports": {
        "@capacitor/core": "https://esm.sh/@capacitor/core@8.5.2"
      }
    }
  </script>
</head>
<body>
  <ion-app>
    <ion-content fullscreen>
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="Estante Parceiros, início">
          <span class="brand-mark"><ion-icon name="book-outline"></ion-icon></span>
          <span>Estante <strong>Parceiros</strong></span>
        </a>
        <nav class="header-actions" aria-label="Navegação">
          <a class="text-link" href="../index.html"><ion-icon name="arrow-back-outline"></ion-icon> Painel do sebo</a>
          <a class="button button-primary button-small" href="./cadastrar-livro.html">Cadastrar livro</a>
        </nav>
      </header>

      <main class="staff-layout">
        <section class="staff-heading">
          <p class="eyebrow">Acervo do sebo</p>
          <h1>Livros cadastrados</h1>
          <p>Consulte os livros do seu acervo em cartões ou em uma tabela organizada.</p>
        </section>

        <p id="catalogFeedback" class="feedback" role="status" aria-live="polite">Validando seu acesso...</p>

        <section id="catalogWorkspace" class="auth-card catalog-card" aria-label="Acervo de livros" hidden>
          <div class="catalog-toolbar">
            <div class="catalog-view-switch" role="group" aria-label="Escolha como visualizar os livros">
              <button id="listViewButton" class="button button-primary button-small" type="button" aria-pressed="true">
                <ion-icon name="list-outline" aria-hidden="true"></ion-icon> Lista
              </button>
              <button id="tableViewButton" class="button button-secondary button-small" type="button" aria-pressed="false">
                <ion-icon name="grid-outline" aria-hidden="true"></ion-icon> Planilha
              </button>
            </div>
            <button id="reloadBooks" class="button button-secondary button-small" type="button">
              <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon> Atualizar
            </button>
          </div>

          <div id="bookList" class="profile-books-list" aria-live="polite"></div>
          <div id="bookTableWrap" class="catalog-table-wrap" hidden>
            <table class="catalog-table">
              <thead>
                <tr>
                  <th scope="col">Título</th>
                  <th scope="col">Autor</th>
                  <th scope="col">Anúncio</th>
                  <th scope="col">Situação</th>
                  <th scope="col">Preço</th>
                  <th scope="col">Estoque</th>
                  <th scope="col">Localização</th>
                  <th scope="col">QR Code</th>
                </tr>
              </thead>
              <tbody id="bookTableBody"></tbody>
            </table>
          </div>

          <div id="catalogPagination" class="catalog-pagination" hidden>
            <button id="previousPage" class="button button-secondary button-small" type="button">
              <ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon> Anterior
            </button>
            <span id="pageSummary" class="profile-books-page"></span>
            <button id="nextPage" class="button button-secondary button-small" type="button">
              Próxima <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
            </button>
          </div>
        </section>
      </main>
      <footer class="site-footer">Estante Parceiros © 2026</footer>
    </ion-content>
  </ion-app>
  <script type="module" src="../js/livros-cadastrados.js"></script>
</body>
</html>
